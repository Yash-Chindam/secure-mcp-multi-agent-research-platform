name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    # The repository contract tests run against a real PostgreSQL rather than a
    # substitute: the row-level security policies that enforce tenant isolation are a
    # database behaviour, and nothing but the database can prove they hold.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Shared budgets and rate limits are proven against a real Redis: atomic claims
      # under concurrency are a property of the store, not of a stand-in for it.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RESEARCH_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
      RESEARCH_TEST_REDIS_URL: redis://localhost:6379/0
      RESEARCH_TEST_ARTIFACT_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # The artifact store contract runs against a real S3-compatible store. It is
      # started here rather than as a service container because the image needs a
      # command, which a service container cannot be given.
      - name: Start MinIO
        run: |
          docker run -d --name minio --user 0:0 -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest server /data
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1
      - run: pytest tests/unit tests/integration --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-coverage
          path: coverage.xml

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # The repository contract tests run against a real PostgreSQL rather than a
    # substitute: the row-level security policies that enforce tenant isolation are a
    # database behaviour, and nothing but the database can prove they hold.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Shared budgets and rate limits are proven against a real Redis: atomic claims
      # under concurrency are a property of the store, not of a stand-in for it.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RESEARCH_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
      RESEARCH_TEST_REDIS_URL: redis://localhost:6379/0
      RESEARCH_TEST_ARTIFACT_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # The artifact store contract runs against a real S3-compatible store. It is
      # started here rather than as a service container because the image needs a
      # command, which a service container cannot be given.
      - name: Start MinIO
        run: |
          docker run -d --name minio --user 0:0 -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest server /data
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1
      - run: pytest tests/integration -m integration

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: playwright install --with-deps chromium
      - run: pytest tests/e2e -m e2e --browser chromium

  policy:
    name: Policy tests
    runs-on: ubuntu-latest
    env:
      OPA_IMAGE: openpolicyagent/opa:1.11.0
    steps:
      - uses: actions/checkout@v7
      - name: Check the policy bundle
        run: |
          docker run --rm -v "$PWD/policy:/policy:ro" "$OPA_IMAGE" check --strict /policy
      - name: Run the policy tests
        run: |
          docker run --rm -v "$PWD/policy:/policy:ro" "$OPA_IMAGE" test /policy --verbose

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: secure-mcp-research-platform:ci

  deploy:
    name: Deployment topology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Validate the Helm chart
        run: |
          helm dependency update deploy/helm/research-platform
          helm lint deploy/helm/research-platform
          helm template deploy/helm/research-platform --set-file opa.policyRego=policy/research/authz.rego > /dev/null
          helm template deploy/helm/research-platform --set-file opa.policyRego=policy/research/authz.rego --set 'mcpServers[0].name=web-research' --set 'mcpServers[1].name=evidence' > /dev/null

  auto-merge:
    name: Merge after CI
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'no-automerge/')
    needs: [quality, unit, integration, e2e, policy, container, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge after all required jobs pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --merge --delete-branch "$PR_URL"
