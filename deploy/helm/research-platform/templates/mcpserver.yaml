{{/*
Independently scalable MCP servers (section 15). Each entry under `mcpServers` runs one
server as its own Deployment and Service over Streamable HTTP
(`python -m research_platform.mcp.servers.serve <name>`), and the settings ConfigMap
points the worker at it through RESEARCH_MCP_SERVER_URLS. A server not listed here still
runs in process inside the worker when its backend is configured. The server reads the
same settings ConfigMap and secrets as the worker, so its backend and boundary are
configured in one place.
*/}}
{{- range .Values.mcpServers }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "research-platform.fullname" $ }}-mcp-{{ .name }}
  labels:
    {{- include "research-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: mcp-{{ .name }}
    plane: mcp
spec:
  replicas: {{ .replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "research-platform.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: mcp-{{ .name }}
  template:
    metadata:
      labels:
        {{- include "research-platform.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: mcp-{{ .name }}
        plane: mcp
    spec:
      serviceAccountName: {{ include "research-platform.fullname" $ }}
      containers:
        - name: mcp-{{ .name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - python
            - -m
            - research_platform.mcp.servers.serve
            - {{ .name | quote }}
            - --port
            - {{ .port | default 8000 | quote }}
          ports:
            - name: http
              containerPort: {{ .port | default 8000 }}
          envFrom:
            - configMapRef:
                name: {{ include "research-platform.fullname" $ }}-settings
            {{- if $.Values.settings.databaseUrl }}
            - secretRef:
                name: {{ include "research-platform.fullname" $ }}-database
            {{- end }}
            {{- if $.Values.settings.redisUrl }}
            - secretRef:
                name: {{ include "research-platform.fullname" $ }}-redis-url
            {{- end }}
            {{- if $.Values.existingSecretName }}
            - secretRef:
                name: {{ $.Values.existingSecretName }}
            {{- end }}
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- if .resources }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "research-platform.fullname" $ }}-mcp-{{ .name }}
  labels:
    {{- include "research-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: mcp-{{ .name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .port | default 8000 }}
      targetPort: http
  selector:
    {{- include "research-platform.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: mcp-{{ .name }}
---
{{- end }}
