apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "research-platform.fullname" . }}-settings
  labels:
    {{- include "research-platform.labels" . | nindent 4 }}
data:
  RESEARCH_OIDC_ISSUER: {{ .Values.settings.oidcIssuer | quote }}
  RESEARCH_OIDC_AUDIENCE: {{ .Values.settings.oidcAudience | quote }}
  RESEARCH_OPA_URL: {{ tpl .Values.settings.opaUrl . | quote }}
  RESEARCH_TEMPORAL_TARGET_HOST: {{ tpl .Values.settings.temporalTargetHost . | quote }}
  RESEARCH_WORKFLOWS_ENABLED: {{ .Values.settings.workflowsEnabled | quote }}
  RESEARCH_TEMPORAL_NAMESPACE: {{ .Values.settings.temporalNamespace | quote }}
  RESEARCH_WEB_ALLOWED_DOMAINS: {{ .Values.settings.webAllowedDomains | quote }}
  RESEARCH_OTEL_EXPORTER_OTLP_ENDPOINT: {{ tpl .Values.settings.otelExporterOtlpEndpoint . | quote }}
  RESEARCH_WEB_SEARCH_URL: {{ .Values.settings.webSearchUrl | quote }}
  RESEARCH_WORKSPACE_ROOTS: {{ .Values.settings.workspaceRoots | quote }}
  RESEARCH_ANALYTICS_TENANT_SCHEMAS: {{ .Values.settings.analyticsTenantSchemas | quote }}
  RESEARCH_GITHUB_REPOSITORIES: {{ .Values.settings.githubRepositories | quote }}
  RESEARCH_SANDBOX_IMAGE: {{ .Values.settings.sandboxImage | quote }}
  RESEARCH_MCP_CLIENT_ID: {{ .Values.settings.mcpClientId | quote }}
  RESEARCH_ARTIFACT_ENDPOINT: {{ tpl .Values.settings.artifactEndpoint . | quote }}
  RESEARCH_ARTIFACT_BUCKET: {{ .Values.settings.artifactBucket | quote }}
  RESEARCH_AGENT_LLM: {{ .Values.settings.agentLlm | quote }}
  RESEARCH_LLM_INPUT_COST_PER_MILLION_USD: {{ .Values.settings.llmInputCostPerMillionUsd | quote }}
  RESEARCH_LLM_OUTPUT_COST_PER_MILLION_USD: {{ .Values.settings.llmOutputCostPerMillionUsd | quote }}
  {{- $urls := list }}
  {{- range .Values.mcpServers }}
  {{- $urls = append $urls (printf "%s=http://%s-mcp-%s:%v/mcp" .name (include "research-platform.fullname" $) .name (.port | default 8000)) }}
  {{- end }}
  RESEARCH_MCP_SERVER_URLS: {{ join "," $urls | quote }}
