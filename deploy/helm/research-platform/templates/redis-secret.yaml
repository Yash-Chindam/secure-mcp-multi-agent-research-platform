{{- /*
The Redis URL carries a password, so it is rendered into a Secret rather than the
settings ConfigMap. A deployment that manages its own credentials should leave
settings.redisUrl empty and supply RESEARCH_REDIS_URL through existingSecretName. It is
named -redis-url because the Redis subchart already owns <release>-redis.
*/}}
{{- if .Values.settings.redisUrl }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "research-platform.fullname" . }}-redis-url
  labels:
    {{- include "research-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  RESEARCH_REDIS_URL: {{ tpl .Values.settings.redisUrl . | quote }}
{{- end }}
