{{- /*
The object store credentials, rendered into a Secret rather than the settings ConfigMap.
A deployment that manages its own credentials should leave settings.artifactAccessKey
empty and supply RESEARCH_ARTIFACT_ACCESS_KEY and RESEARCH_ARTIFACT_SECRET_KEY through
existingSecretName instead.
*/}}
{{- if and .Values.settings.artifactEndpoint .Values.settings.artifactAccessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "research-platform.fullname" . }}-artifacts
  labels:
    {{- include "research-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  RESEARCH_ARTIFACT_ACCESS_KEY: {{ .Values.settings.artifactAccessKey | quote }}
  RESEARCH_ARTIFACT_SECRET_KEY: {{ .Values.settings.artifactSecretKey | quote }}
{{- end }}
