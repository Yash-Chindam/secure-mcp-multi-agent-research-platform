{{- /*
The database URL carries a password, so it is rendered into a Secret rather than the
settings ConfigMap. A deployment that manages its own credentials should leave
settings.databaseUrl empty and supply RESEARCH_DATABASE_URL through existingSecretName
instead, which keeps the password out of this chart's values entirely.
*/}}
{{- if .Values.settings.databaseUrl }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "research-platform.fullname" . }}-database
  labels:
    {{- include "research-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  RESEARCH_DATABASE_URL: {{ tpl .Values.settings.databaseUrl . | quote }}
{{- end }}
