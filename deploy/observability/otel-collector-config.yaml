# Receives the traces and metrics research_platform.observability exports over OTLP
# (RESEARCH_OTEL_EXPORTER_OTLP_ENDPOINT) and fans them out to Tempo and Prometheus.
# There is no log pipeline here yet - nothing in the platform ships logs over OTLP today,
# so Loki has no source configured against it in this file.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
