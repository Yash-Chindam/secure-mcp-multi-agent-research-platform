## Local development stack for the deployment topology in section 15 of
## 01-secure-mcp-multi-agent-research-platform.md.
##
## Brings up every dependency the platform is actually wired to today - Temporal,
## PostgreSQL, Redis, MinIO, Keycloak, OPA, and an observability path from the app's own
## OpenTelemetry export through to Prometheus, Grafana, Loki and Tempo - plus the
## platform's two own processes: the FastAPI ingress ("api") and the Temporal worker
## ("worker"), built from the same Dockerfile section 15 already uses for the container
## build. It is a development convenience, not the deployment topology itself: that is
## what deploy/helm describes for a real cluster, with the NetworkPolicies this compose
## file has no equivalent for.
##
## The api and worker share one PostgreSQL system of record, so a status the worker
## writes is visible to the API immediately. They connect as "research_app", a role
## created on first start that owns the database but is not a superuser, so the
## row-level security policies the schema installs bind it.
##
## Identity is verified: Keycloak imports the "research" realm from deploy/keycloak on
## start, the API accepts only its access tokens, and the worker calls the web research
## MCP server with a short-lived service token that server verifies. Sign in at
## http://localhost:8000 as alice (requester), rita (reviewer) or adam (administrator);
## each one's password is their name. olga belongs to a different tenant. These accounts
## and the client secret in the realm file are for local development only.
##
## An existing postgres-data volume from before this role existed must be removed
## (docker compose down -v) for the role to be created.
##
## Reports, provenance manifests and evidence bundles are exported to MinIO
## (console at http://localhost:9001, minioadmin/minioadmin); the bucket is created on
## first start.
##
## Everything works from a cold `docker compose up`. Keycloak's own console is at
## http://localhost:8081 (admin/admin).

name: research-platform

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile

x-app-environment: &app-environment
  RESEARCH_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  RESEARCH_OPA_URL: http://opa:8181
  RESEARCH_TEMPORAL_TARGET_HOST: temporal:7233
  RESEARCH_WORKFLOWS_ENABLED: "true"
  RESEARCH_DATABASE_URL: postgresql://research_app:research_app@postgres:5432/research_platform
  # Tokens name the address a browser reaches Keycloak at, so that is the issuer; the
  # containers fetch signing keys and service tokens over the compose network instead.
  RESEARCH_OIDC_ISSUER: http://localhost:8081/realms/research
  RESEARCH_OIDC_AUDIENCE: research-platform
  RESEARCH_OIDC_JWKS_URI: http://keycloak:8080/realms/research/protocol/openid-connect/certs
  RESEARCH_OIDC_TOKEN_URL: http://keycloak:8080/realms/research/protocol/openid-connect/token
  RESEARCH_OIDC_UI_CLIENT_ID: research-ui
  # Budgets and rate limits are counted in Redis so every worker and server replica
  # spends against one total.
  RESEARCH_REDIS_URL: redis://redis:6379/0
  RESEARCH_ARTIFACT_ENDPOINT: http://minio:9000
  RESEARCH_ARTIFACT_ACCESS_KEY: minioadmin
  RESEARCH_ARTIFACT_SECRET_KEY: minioadmin
  RESEARCH_ARTIFACT_BUCKET: research-artifacts
  # The public sources research may read. Override in the environment or an .env file.
  RESEARCH_WEB_ALLOWED_DOMAINS: ${RESEARCH_WEB_ALLOWED_DOMAINS:-wikipedia.org,arxiv.org}

services:
  # ---- application plane ----

  api:
    <<: *app-image
    ports:
      - "8000:8000"
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
      temporal:
        condition: service_started
      keycloak:
        condition: service_healthy
      opa:
        condition: service_started
      otel-collector:
        condition: service_started
    networks: [application, data, observability]

  worker:
    <<: *app-image
    command: ["python", "-m", "research_platform.worker"]
    # The image's health check asks an HTTP port the worker does not have; a worker is
    # healthy for as long as its process is running.
    healthcheck:
      disable: true
    environment:
      <<: *app-environment
      RESEARCH_MCP_SERVER_URLS: web-research=http://mcp-web-research:8000/mcp
      RESEARCH_MCP_CLIENT_ID: research-gateway
      RESEARCH_MCP_CLIENT_SECRET: research-gateway-development-secret
      # CrewAI reads the model provider key from the environment; without one the
      # agents cannot call a model and every job fails at planning.
      RESEARCH_AGENT_LLM: ${RESEARCH_AGENT_LLM:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
      temporal:
        condition: service_started
      keycloak:
        condition: service_healthy
      opa:
        condition: service_started
      otel-collector:
        condition: service_started
    networks: [application, mcp, data, observability]

  # ---- MCP plane ----
  # The web research server runs as its own service over Streamable HTTP, the way
  # section 15 deploys it; the worker reaches it through RESEARCH_MCP_SERVER_URLS. The
  # evidence server runs in process inside the worker. The server verifies a bearer token
  # on every request, which the worker obtains from Keycloak as the research-gateway
  # client.

  mcp-web-research:
    <<: *app-image
    command: ["python", "-m", "research_platform.mcp.servers.serve", "web-research"]
    environment:
      <<: *app-environment
    depends_on:
      redis:
        condition: service_started
      keycloak:
        condition: service_healthy
    # On the data network only to reach Redis, where its request rate limit is counted.
    networks: [mcp, data, observability]

  # ---- data plane ----

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: research_platform
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      APP_DB_USER: research_app
      APP_DB_PASSWORD: research_app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks: [data]

  minio:
    # MinIO no longer publishes its own community image; this is the maintained build.
    # It runs as a non-root user by default, which cannot write a fresh named volume, so
    # this development stack runs it as root.
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks: [data]

  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]

  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "7233:7233"
    depends_on:
      temporal-postgres:
        condition: service_healthy
    networks: [application, mcp, data]

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8088
    ports:
      - "8088:8080"
    depends_on:
      temporal:
        condition: service_started
    networks: [data]

  # ---- identity and policy ----

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # One issuer for every token, whichever address the request for it arrived on.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
    networks: [application, mcp]

  opa:
    image: openpolicyagent/opa:1.11.0
    command: ["run", "--server", "--addr", ":8181", "/policy"]
    volumes:
      - ./policy:/policy:ro
    ports:
      - "8181:8181"
    networks: [application, mcp]

  # ---- observability plane ----

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus scrape endpoint
    depends_on:
      - prometheus
      - tempo
      - loki
    networks: [application, mcp, observability]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [observability]

  loki:
    image: grafana/loki:3.2.1
    ports:
      - "3100:3100"
    networks: [observability]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
    networks: [observability]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks: [observability]

networks:
  application:
  mcp:
  data:
  observability:

volumes:
  postgres-data:
  temporal-postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
